server:
  port: ${PORT:8080}

spring:
  application:
    name: mv-finds-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mv_finds}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

# Application specific configuration
app:
  # Path where uploaded product images are saved (relative to backend folder, pointing to frontend public/products)
  upload:
    dir: ${UPLOAD_DIR:../public/products}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
